<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - POCKETA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container register-box">

        <div class="logo">POCKETA<span>.</span></div>

        <h2>Create Account</h2>
        <p>Daftar dan mulai perjalananmu bersama POCKETA.</p>

        <form id="registerForm">

            <input type="hidden" id="role" value="user">

            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text"
                       id="nama"
                       placeholder="Masukkan nama lengkap"
                       required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email"
                       id="email"
                       placeholder="Masukkan email"
                       required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password"
                       id="password"
                       placeholder="Buat password"
                       minlength="8"
                       required>
            </div>

            <div class="input-group">
                <label>Konfirmasi Password</label>
                <input type="password"
                       id="confirmPassword"
                       placeholder="Konfirmasi password"
                       required>
            </div>

            <div class="input-group" id="adminCodeGroup"
                 style="display:none;">
                <label>Kode Undangan Admin</label>
                <input type="text"
                       id="adminCode"
                       placeholder="Masukkan kode undangan">
            </div>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p id="message" role="status"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
